<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 리스트 클론 코딩</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #222222;
    --gutter: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .menu {
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 28px var(--gutter);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .menu::-webkit-scrollbar { display: none; }

  .menu-item {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 64px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
  }
  .menu-item:hover .icon { transform: translateY(-2px); }

  .icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    transition: transform .15s ease;
  }
  .icon svg {
    width: 26px; height: 26px;
    fill: none; stroke: #fff; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .clean  { background: #2bb3ff; }
  .furniture { background: #ffb020; }
  .food   { background: #ff6b5b; }
  .sport  { background: #3ccf7a; }

  @media (max-width: 720px) {
    .menu { justify-content: flex-start; gap: 20px; }
  }
</style>
</head>
<body>

  <nav class="menu" id="menu" aria-label="메뉴"></nav>

<script>
  const items = [
    { label: "청소", color: "clean",     icon: '<path d="M18 3l-7 10"/><path d="M8 13h7l2 6H6z"/><path d="M9 16v3M12 16v3"/>' },
    { label: "가구", color: "furniture", icon: '<path d="M4 11V9a2 2 0 012-2h12a2 2 0 012 2v2"/><path d="M3 11h18v5H3z"/><path d="M5 16v3M19 16v3"/>' },
    { label: "음식", color: "food",      icon: '<path d="M6 3v5a2 2 0 004 0V3"/><path d="M8 10v11"/><path d="M17 3c-2 2-2 7 0 9v9"/>' },
    { label: "운동", color: "sport",     icon: '<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>' },
  ];

  document.getElementById("menu").innerHTML = items.map((it) => `
    <a class="menu-item" href="#">
      <span class="icon ${it.color}">
        <svg viewBox="0 0 24 24" aria-hidden="true">${it.icon}</svg>
      </span>
      <span>${it.label}</span>
    </a>`).join("");
</script>
</body>
</html>
